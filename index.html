<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>Todo | タスク管理</title>
    <link rel="stylesheet" href="src/styles.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <main>
      <h1 class="app-title">Todo</h1>
      <form id="todo-form" class="input-area">
        <label for="add-text">Todo</label>
        <input id="add-text" type="text" placeholder="Todoを入力" autocomplete="off" />
        <button id="add-button" type="submit">追加</button>
      </form>
      <p id="status-message" role="status"></p>

      <section class="imcomplete-area" aria-labelledby="incomplete-title">
        <h2 id="incomplete-title" class="title">未完了のTodo</h2>
        <ul id="imcomplete-list"></ul>
      </section>

      <section class="complete-area" aria-labelledby="complete-title">
        <h2 id="complete-title" class="title">完了したTodo</h2>
        <ul id="complete-list"></ul>
      </section>

    </main>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
