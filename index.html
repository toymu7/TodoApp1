<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>TodoAPP</title>
    <link rel="stylesheet" href="src/styles.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <form id="todo-form" class="input-area">
      <label for="add-text">Todo</label>
      <input id="add-text" placeholder="TODOを入力" />
      <button id="add-button" type="submit">追加</button>
    </form>
    <p id="status-message" role="status"></p>

    <div class="imcomplete-area">
      <p class="title">未完了のTodo</p>
      <ul id="imcomplete-list"></ul>
    </div>

    <div class="complete-area">
      <p class="title">完了したTodo</p>
      <ul id="complete-list"></ul>
    </div>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
